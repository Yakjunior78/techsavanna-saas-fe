stages:
  - build
  - deploy

variables:
  REGISTRY: registry.gitlab.com/techsavanna-sass/techsavanna-saas-fe
  DOCKER_BUILDKIT: "1"

# -----------------------------------------------------------
# Build & push template
# -----------------------------------------------------------
.build-template: &build-template
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login $CI_REGISTRY -u $CI_REGISTRY_USER --password-stdin
  script:
    - |
      IMAGE="${REGISTRY}/${APP_NAME}"
      TAG_SHA="${CI_COMMIT_SHORT_SHA}"
      TAG_BRANCH="${CI_COMMIT_REF_SLUG}"

      docker build \
        -f apps/${APP_NAME}/Dockerfile \
        --target production \
        -t "${IMAGE}:${TAG_SHA}" \
        -t "${IMAGE}:${TAG_BRANCH}" \
        .

      # Tag as 'latest' only on main branch
      if [ "$CI_COMMIT_BRANCH" = "main" ]; then
        docker tag "${IMAGE}:${TAG_SHA}" "${IMAGE}:latest"
      fi

      docker push "${IMAGE}" --all-tags
  rules:
    - if: $CI_COMMIT_BRANCH == "dev" || $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "web"

# -----------------------------------------------------------
# Per-app build jobs
# -----------------------------------------------------------
build-pos:
  <<: *build-template
  variables:
    APP_NAME: pos

build-people:
  <<: *build-template
  variables:
    APP_NAME: people

build-elimu:
  <<: *build-template
  variables:
    APP_NAME: elimu

build-erp:
  <<: *build-template
  variables:
    APP_NAME: erp

# -----------------------------------------------------------
# Deploy to Kubernetes via SSH
# -----------------------------------------------------------
# Required CI/CD variables (Settings > CI/CD > Variables):
#   DEPLOY_SSH_KEY  - SSH private key, base64-encoded (type: Variable, protected)
#   DEPLOY_HOST     - Server hostname/IP (e.g. 75.119.132.10)
#   DEPLOY_PORT     - SSH port (e.g. 1191)
#   DEPLOY_USER     - SSH user (e.g. deploy)
# -----------------------------------------------------------

deploy:
  stage: deploy
  image: alpine:3.20
  needs:
    - job: build-pos
      optional: true
    - job: build-people
      optional: true
    - job: build-elimu
      optional: true
    - job: build-erp
      optional: true
  rules:
    - if: $CI_COMMIT_BRANCH == "dev" || $CI_COMMIT_BRANCH == "main"
  before_script:
    - apk add --no-cache openssh-client
    - echo "$DEPLOY_SSH_KEY" | base64 -d > /tmp/deploy_key
    - chmod 600 /tmp/deploy_key
  script:
    - |
      ssh -o StrictHostKeyChecking=no -i /tmp/deploy_key -p ${DEPLOY_PORT} ${DEPLOY_USER}@${DEPLOY_HOST} bash -s <<DEPLOY_SCRIPT
        set -euo pipefail
        export PATH=\$PATH:/var/lib/rancher/rke2/bin
        export KUBECONFIG=/etc/rancher/rke2/rke2.yaml

        # Restart deployments to pull latest images
        kubectl -n techsavanna-saas rollout restart deployment pos people elimu erp

        # Verify rollouts
        kubectl -n techsavanna-saas rollout status deployment/pos --timeout=120s
        kubectl -n techsavanna-saas rollout status deployment/people --timeout=120s
        kubectl -n techsavanna-saas rollout status deployment/elimu --timeout=120s
        kubectl -n techsavanna-saas rollout status deployment/erp --timeout=120s
      DEPLOY_SCRIPT
