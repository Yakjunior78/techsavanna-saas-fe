stages:
  - build

variables:
  REGISTRY: registry.gitlab.com/techsavanna-sass/techsavanna-saas-fe
  DOCKER_BUILDKIT: "1"

# -----------------------------------------------------------
# Build & push template
# -----------------------------------------------------------
.build-template: &build-template
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login $CI_REGISTRY -u $CI_REGISTRY_USER --password-stdin
  script:
    - |
      IMAGE="${REGISTRY}/${APP_NAME}"
      TAG_SHA="${CI_COMMIT_SHORT_SHA}"
      TAG_BRANCH="${CI_COMMIT_REF_SLUG}"

      docker build \
        -f apps/${APP_NAME}/Dockerfile \
        --target production \
        -t "${IMAGE}:${TAG_SHA}" \
        -t "${IMAGE}:${TAG_BRANCH}" \
        .

      # Tag as 'latest' only on main branch
      if [ "$CI_COMMIT_BRANCH" = "main" ]; then
        docker tag "${IMAGE}:${TAG_SHA}" "${IMAGE}:latest"
      fi

      docker push "${IMAGE}" --all-tags
  rules:
    - if: $CI_COMMIT_BRANCH == "dev" || $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "web"

# -----------------------------------------------------------
# Per-app build jobs
# -----------------------------------------------------------
build-pos:
  <<: *build-template
  variables:
    APP_NAME: pos

build-people:
  <<: *build-template
  variables:
    APP_NAME: people

build-elimu:
  <<: *build-template
  variables:
    APP_NAME: elimu

build-erp:
  <<: *build-template
  variables:
    APP_NAME: erp
