apiVersion: apps/v1
kind: Deployment
metadata:
  name: pos
  namespace: techsavanna-saas
  labels:
    app: pos
    app.kubernetes.io/name: pos
    app.kubernetes.io/part-of: techsavanna-saas
    app.kubernetes.io/component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pos
  template:
    metadata:
      labels:
        app: pos
        app.kubernetes.io/name: pos
        app.kubernetes.io/part-of: techsavanna-saas
    spec:
      imagePullSecrets:
        - name: gitlab-registry-secret
      containers:
        - name: pos
          image: registry.gitlab.com/techsavanna-sass/techsavanna-saas-fe/pos:dev
          imagePullPolicy: Always
          ports:
            - containerPort: 80
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
