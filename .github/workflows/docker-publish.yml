name: Build and Push Docker Images

on:
  push:
    branches: [dev, main]
  workflow_dispatch:
    inputs:
      app:
        description: "App to build (leave empty for all)"
        required: false
        type: choice
        options:
          - all
          - pos
          - people
          - elimu
          - erp

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      pos: ${{ steps.filter.outputs.pos }}
      people: ${{ steps.filter.outputs.people }}
      elimu: ${{ steps.filter.outputs.elimu }}
      erp: ${{ steps.filter.outputs.erp }}
      packages: ${{ steps.filter.outputs.packages }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            pos:
              - 'apps/pos/**'
            people:
              - 'apps/people/**'
            elimu:
              - 'apps/elimu/**'
            erp:
              - 'apps/erp/**'
            packages:
              - 'packages/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'tsconfig.base.json'

  build-and-push:
    name: Build ${{ matrix.app }}
    runs-on: ubuntu-latest
    needs: changes
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        app: [pos, people, elimu, erp]
    # Build if: manual trigger (all or this app), shared packages changed, or this app changed
    if: |
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.packages == 'true' ||
      needs.changes.outputs[matrix.app] == 'true'
    steps:
      - name: Skip if manual and not selected
        if: |
          github.event_name == 'workflow_dispatch' &&
          github.event.inputs.app != 'all' &&
          github.event.inputs.app != matrix.app
        run: echo "Skipping ${{ matrix.app }}" && exit 0

      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.app }}
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          target: production
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
