services:
  admin:
    build:
      context: ..
      dockerfile: apps/admin/Dockerfile
      target: builder
    ports:
      - "3000:3000"
    volumes:
      - ../apps/admin/src:/app/apps/admin/src
      - ../packages:/app/packages
    env_file:
      - ../apps/admin/.env
    environment:
      - NODE_ENV=development
      - VITE_POS_DOMAIN=localhost:3001
      - VITE_PEOPLE_DOMAIN=localhost:3002
      - VITE_ELIMU_DOMAIN=localhost:3003
      - VITE_ERP_DOMAIN=localhost:3004
    command: sh -c "cd /app && pnpm install --prefer-offline && cd /app/apps/admin && pnpm dev --host"
    networks:
      - savanna-dev

  pos:
    build:
      context: ..
      dockerfile: apps/pos/Dockerfile
      target: builder
    ports:
      - "3001:3001"
    volumes:
